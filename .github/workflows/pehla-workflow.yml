name: dusra workflow
on: [workflow_dispatch]
jobs:
 checkout-code-and-install-node:
  runs-on: ubuntu-latest
  steps:
   - name: checkout code
     uses: actions/checkout@v5
   - name: Setup Node.js environment
     uses: actions/setup-node@v7.1.0
     with:
      node-version: 22
 install-frontend-dependency:
  runs-on: ubuntu-latest
  needs: [checkout-code-and-install-node]
  steps:
   - name: check package-lock json is available or not
     run: test -f frontend/package-lock.json
   - name: installing Dependency in frontend
     working-directory: frontend
     run : npm ci
 install-backend-dependency:
  runs-on: ubuntu-latest
  needs: checkout-the-code
  steps:
   - name: check package-lock json is available or not
     run: test -f backend/package-lock.json
   - name: installing Dependency in backend
     working-directory: frontend
     run : npm ci
  
